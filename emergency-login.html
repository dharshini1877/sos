<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
body{margin:0;font-family:'Segoe UI';background:#1d3557;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:15px;width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.3);text-align:center}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;background:#e63946;color:white;padding:12px;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}
button:hover{background:#c1121f}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Admin Login</h2>
<input type="text" id="adminId" placeholder="Admin ID (101 / 102)">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg" style="color:red;margin-top:10px"></p>
</div>

<script>
function login(){
let id = document.getElementById('adminId').value.trim();
let pass = document.getElementById('password').value.trim();
if((id=='101' && pass=='spider') || (id=='102' && pass=='man')){
localStorage.setItem('adminLogged','yes');
window.location.href='emergency-dashboard.html';
}else{
document.getElementById('msg').innerText='Invalid ID or Password!';
}
}
</script>
</body>
</html>
